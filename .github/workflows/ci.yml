name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: ilcf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d ilcf_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: "postgresql://test_user:test_pass@localhost/ilcf_test"
      DATABASE_URL: "postgresql://test_user:test_pass@localhost/ilcf_test"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (critical rules)
        run: ruff check . --select E9,F63,F7,F82

      - name: Run tests
        run: pytest -q -m "not integration"
