name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Two shards (2026-10-28): the per-entity analytics suites build a schema per test case and pushed the
    # single job past its 20-minute cap. "core" is the rest of the suite; "entity" is the three entity suites.
    strategy:
      fail-fast: false
      matrix:
        shard: [core, entity]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: ilcf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d ilcf_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: "postgresql://test_user:test_pass@localhost/ilcf_test"
      DATABASE_URL: "postgresql://test_user:test_pass@localhost/ilcf_test"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (critical rules)
        if: matrix.shard == 'core'
        run: ruff check . --select E9,F63,F7,F82

      - name: Run tests (core)
        if: matrix.shard == 'core'
        run: pytest -q -m "not integration" --ignore=tests/test_entity_analytics_routes.py --ignore=tests/test_entity_analytics.py --ignore=tests/test_entity_network.py

      - name: Run tests (entity)
        if: matrix.shard == 'entity'
        run: pytest -q -m "not integration" tests/test_entity_analytics_routes.py tests/test_entity_analytics.py tests/test_entity_network.py
